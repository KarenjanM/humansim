[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]

[tool.coverage.run]
omit = [
    "*/benchmark.py",
    "*/behavior/document_nodes_description.py",
]

[tool.ruff]
target-version = "py312"
line-length = 320
src = ["arena_humansim"]
extend-exclude = ["launch", "tests", "arena_humansim/utils/renderer.py", "arena_humansim/core/recorder.py", "arena_humansim/local_planner/socialgail/net", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI"]
ignore = ["E501", "E402"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
